<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum - Hey Communications</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css"/>
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,300&display=swap" rel="stylesheet">
    
    <!-- Main Styles -->
    <link href="assets/css/app.css" rel="stylesheet">
    
    <link rel="shortcut icon" href="assets/img/favico.png" type="image/x-icon">
    
    <style>
        /* Additional styles to make pendulum work standalone */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        
        #pendulum {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .bg-light {
            background-color: #f8f9fa;
        }
        
        .d--none {
            display: none !important;
        }
        
        .mt--auto {
            margin-top: auto;
        }
        
        /* Preloader styles */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loader.show {
            display: flex;
        }
        
        .dot-container {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #fff;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot-1 {
            animation-delay: -0.32s;
        }
        
        .dot-2 {
            animation-delay: -0.16s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    
    <!-- Pendulum Section -->
    <div class="bg-light" id="pendulum">
        <!-- <div id="drag-to-left">
            <div class="hand-wrapper">
                <img src="assets/img/landing/drag-right.png" class="hand" alt="">
            </div>
        </div> -->
        <div id="pendulum-container">
            <div id="pendulum-wrapper">
                <div class="pendulum-parent pendulum-parent1" id="pendulum-parent1">
                    <div id="drag-instruction">
                        <img src="assets/img/wwd-instruction.png" alt="">
                    </div>
                    <div id="pendulum-child1" class="pendulum-child">
                        <img src="assets/img/pendulum-ball-1.png" alt="" id="rotate" class="pendulum-rope" srcset="">
                    </div>
                </div>
            </div>
            <div class="context">
                <div class="context-wrapper" id="pendulumContextContainer">
                    <h2 class="context-title">WE ARE YOUR CALL TO ACTION<i>!</i></h2>
                    <h2 class="context-title">THE VOICE THAT HELPS YOU RISE ABOVE THE CLUTTER</h2>
                    <h2 class="context-title">STRATEGIC. INSIGHTFUL. EFFECTIVE.</h2>
                    <h2 class="context-title">COMPLEMENTED WITH INNOVATIVE SOLUTIONS</h2>
                    <h2 class="context-title">SO YOUR MESSAGE CAN BE HEARD</h2>
                    <h2 class="context-title">FROM YOUR JOURNEY ON GROUND</h2>
                    <h2 class="context-title">TO YOUR MOMENTS ON-AIR</h2>
                    <h2 class="context-title">WE ARE YOUR BRANDS SHOUTOUT</h2>
                    <h2 class="context-title">FROM PURPOSE TO YOUR <br> POINT OF SALE</h2>
                </div>
            </div>
            <div class="pendulum-parent pendulum-parent2">
                <div id="pendulum-child2" class="pendulum-child">
                    <img src="assets/img/pendulum-ball-1.png" alt="" class="pendulum-rope" srcset="">
                </div>
            </div>
        </div>
        
        <div class="d--none" id="pendulum-audio"></div>
        <!-- <div class="nav main-nav mt--auto">
            <img src="assets/img/hey-logo.png" class="brand" alt="">
        </div> -->
    </div>

    <!-- PRELOADER -->
    <div id="preloader" class="loader show">
        <div class="dot-container">
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.5.1.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    
    <script>
        // Initialize pendulum context - hide all except first
        $(document).ready(function() {
            $('#pendulumContextContainer .context-title:not(:first-child)').css('display', 'none');
        });

        // Detect touch device and load appropriate script
        if('ontouchstart' in document.documentElement) { 
            $.getScript("assets/js/app-mobile-standalone.js")
            .done(function(script, textStatus) {
                console.log("Mobile script loaded:", textStatus);
                $('#preloader').removeClass('show');
            })
            .fail(function(jqxhr, settings, exception) {
                console.log("Error loading mobile script:", jqxhr, settings, exception);
                $('#preloader').removeClass('show');
            });
            
        } else { 
            $.getScript("assets/js/app-desktop-standalone.js")
            .done(function(script, textStatus) {
                console.log("Desktop script loaded:", textStatus);
                $('#preloader').removeClass('show');
            })
            .fail(function(jqxhr, settings, exception) {
                console.log("Error loading desktop script:", jqxhr, settings, exception);
                $('#preloader').removeClass('show');
            });
        }
    </script>

</body>
</html>
